services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-paper-lab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lab -d lab']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD:-local-paper-lab}@db:5432/lab
      CONFIG_PATH: /app/config.yaml
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_PROVIDER: ${JEV_PROVIDER:-typesafe}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      JEV_MODEL: ${JEV_MODEL:-}
      LOCAL_JEV_API_KEY: ${LOCAL_JEV_API_KEY:-}
      JEV_CONCURRENCY: ${JEV_CONCURRENCY:-}
      LOCAL_JEV_TIMEOUT_SECONDS: ${LOCAL_JEV_TIMEOUT_SECONDS:-}
      CRYPTO_DATA_PROVIDER: ${CRYPTO_DATA_PROVIDER:-upbit}
      STOCK_DATA_PROVIDER: ${STOCK_DATA_PROVIDER:-kis}
      STOCK_API_KEY: ${STOCK_API_KEY:-}
      STOCK_API_SECRET: ${STOCK_API_SECRET:-}
      STOCK_FEED: ${STOCK_FEED:-iex}
      LAB_MODE: ${LAB_MODE:-LIVE_PAPER}
      LAB_RUN_ID: ${LAB_RUN_ID:-krw-scalp-1m-v2}
      LAB_TOURNAMENT_ID: ${LAB_TOURNAMENT_ID:-jev-tournament-7d-v1}
      LAB_AUTOSTART: ${LAB_AUTOSTART:-true}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ['${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:3000:3000']
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:

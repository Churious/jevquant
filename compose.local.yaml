# Linux와 Windows Docker Desktop (Linux containers) 공통 CPU 실행 모드.
services:
  backend:
    environment:
      JEV_PROVIDER: local
      JEV_BASE_URL: http://ollama:11434
      JEV_MODEL: ${LOCAL_JEV_MODEL:-tev1:0.8b}
      LOCAL_JEV_API_KEY: ''
      JEV_CONCURRENCY: ${LOCAL_JEV_CONCURRENCY:-1}
      LAB_RUN_ID: ${LOCAL_LAB_RUN_ID:-krw-local-tev08-1m-v1}
    depends_on:
      ollama:
        condition: service_started
      local-model:
        condition: service_completed_successfully
  ollama:
    image: ollama/ollama:0.35.0
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 1h
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
  local-model:
    image: ollama/ollama:0.35.0
    environment:
      OLLAMA_HOST: http://ollama:11434
      LOCAL_JEV_MODEL: ${LOCAL_JEV_MODEL:-tev1:0.8b}
    entrypoint: [/bin/sh, -c]
    command:
      - 'until ollama list >/dev/null 2>&1; do sleep 2; done; exec ollama pull "$$LOCAL_JEV_MODEL"'
    depends_on:
      ollama:
        condition: service_started
    restart: 'no'
volumes:
  ollama_models:
